name: Taskflow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Report frontend toolchain
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-and-api:
    name: Java and MySQL API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: taskflow_api_test
          MYSQL_USER: taskflow_api_test
          MYSQL_PASSWORD: taskflow_ci_database_only
          MYSQL_ROOT_PASSWORD: taskflow_ci_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptaskflow_ci_root_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/api/requirements.txt

      - name: Report backend toolchain
        run: |
          java -version
          javac -version
          mvn --version
          python --version

      - name: Create isolated API-test environment
        run: |
          python -m venv .venv-api-tests-ci
          .venv-api-tests-ci/bin/python -m pip install \
            --requirement tests/api/requirements.txt

      - name: Run Java build and integration tests
        run: mvn --batch-mode --file backend/pom.xml clean verify

      - name: Run black-box API tests against MySQL 8.4
        shell: bash
        env:
          TASKFLOW_API_TEST_DATABASE_KIND: mysql
          TASKFLOW_TEST_DATABASE_URL: 'jdbc:mysql://127.0.0.1:3306/taskflow_api_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false'
          TASKFLOW_TEST_DATABASE_USER: taskflow_api_test
          TASKFLOW_TEST_DATABASE_PASSWORD: taskflow_ci_database_only
          TASKFLOW_API_TEST_VENV: .venv-api-tests-ci
          TASKFLOW_API_TEST_ARTIFACT_DIR: .artifacts/ci
          TASKFLOW_API_TEST_RUN_MYSQL_PROOF: 'true'
          TASKFLOW_MYSQL_HOST: 127.0.0.1
          TASKFLOW_MYSQL_PORT: '3306'
          TASKFLOW_MYSQL_DATABASE: taskflow_api_test
          TASKFLOW_MYSQL_USER: taskflow_api_test
          TASKFLOW_MYSQL_PASSWORD: taskflow_ci_database_only
        run: ./scripts/run-api-tests.sh 3

      - name: Archive Java, API, and backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-and-api-test-results
          path: |
            backend/target/surefire-reports/
            .artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
