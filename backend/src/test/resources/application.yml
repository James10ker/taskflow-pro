    secret: dGFza2Zsb3ctdGVzdC1zZWNyZXQtbXVzdC1iZS0zMi1ieXRlcyE=
    issuer: taskflow-api
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
