    url: jdbc:h2:mem:taskflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

app:
